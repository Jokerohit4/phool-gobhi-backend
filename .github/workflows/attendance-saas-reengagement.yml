name: Attendance-SaaS re-engagement sweep

# Triggers auth-service's runAttendanceSaasReengagementSweepService (via
# POST /internal/attendance-saas/reengagement-sweep) daily. Nudges gym-linked
# signups (User.linkedGymId set, via a gym's /join link) who show no
# activity — no completed booking, no gym-subscription purchase — a few days
# after registering.
#
# Auth is two-layered, same as every other internal endpoint in this repo
# and the same pattern reconcile-razorpay-orders.yml uses: an x-internal-key
# header (the app-level requireInternal check) AND a Google-signed ID token
# scoped to auth-service's own URL as audience (Cloud Run's IAM invoker
# check on this no-allow-unauthenticated service).

on:
  schedule:
    - cron: '0 4 * * *'   # daily, 04:00 UTC — staggered from the other two scheduled sweeps
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  reengagement-sweep:
    strategy:
      matrix:
        env: [dev, prod]
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - id: secret
        uses: google-github-actions/get-secretmanager-secrets@v2
        with:
          secrets: |-
            INTERNAL_API_KEY:${{ vars.GCP_PROJECT_ID }}/internal-api-key-${{ matrix.env }}

      - id: svcurl
        run: |
          URL=$(gcloud run services describe "auth-service-${{ matrix.env }}" \
            --project="${{ vars.GCP_PROJECT_ID }}" --region="${{ vars.GCP_REGION }}" \
            --format="value(status.url)")
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - id: sweepauth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ matrix.env == 'prod' && vars.GCP_WIF_PROVIDER_HEALTH_PROD || vars.GCP_WIF_PROVIDER_HEALTH_DEV }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}
          token_format: 'id_token'
          id_token_audience: ${{ steps.svcurl.outputs.url }}

      - run: |
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${{ steps.sweepauth.outputs.id_token }}" \
            -H "x-internal-key: ${{ steps.secret.outputs.INTERNAL_API_KEY }}" \
            "${{ steps.svcurl.outputs.url }}/internal/attendance-saas/reengagement-sweep"
