name: Deploy to Cloud Run

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
    # Manual deploy of every changed service on the chosen ref. The
    # detect-changed-services step gets an empty `before` for this event, so
    # it treats all services as changed — an explicit full redeploy.
    inputs:
      ref:
        description: 'Branch or commit SHA to deploy (default: current branch)'
        required: false

permissions:
  contents: read
  id-token: write   # required for google-github-actions/auth (WIF)

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      any: ${{ steps.detect.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: refs
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "base=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - id: detect
        run: node deploy/scripts/detect-changed-services.cjs "${{ steps.refs.outputs.base }}" "${{ steps.refs.outputs.head }}"

  preflight:
    needs: changes
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The analytics-drift-check script/registry may not exist yet on every
      # branch (it landed on dev first) — treat its absence as "not
      # applicable here yet", not a reason to block every future deploy on
      # this branch until it's merged.
      - run: |
          if [ -f "scripts/check-analytics-events.cjs" ]; then
            node scripts/check-analytics-events.cjs
          else
            echo "scripts/check-analytics-events.cjs not present on this branch — skipping."
          fi

  # PR events never deploy (the WIF provider's attribute-condition wouldn't
  # accept a PR merge ref anyway) — instead just prove each changed service's
  # Dockerfile still builds, catching a broken install/`prisma generate`
  # before merge with zero GCP access needed.
  build-validate:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - id: svcmeta
        run: |
          node -e "
            const s = require('./deploy/services.json').services['${{ matrix.service }}'];
            require('fs').appendFileSync(process.env.GITHUB_OUTPUT, 'source-dir=' + s.sourceDir + '\n');
          "
      - run: docker build -f "${{ steps.svcmeta.outputs.source-dir }}/Dockerfile" "${{ steps.svcmeta.outputs.source-dir }}"

  deploy:
    needs: [changes, preflight]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'dev' }}
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.matrix) }}
    concurrency:
      group: deploy-${{ matrix.service }}-${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - id: env
        run: echo "ENV=${{ github.ref_name == 'main' && 'prod' || 'dev' }}" >> "$GITHUB_OUTPUT"

      - id: svcmeta
        run: |
          node -e "
            const s = require('./deploy/services.json').services['${{ matrix.service }}'];
            const fs = require('fs');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'source-dir=' + s.sourceDir + '\n');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'has-prisma=' + !!s.hasPrisma + '\n');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'health-guard=' + !!s.healthCheckGuard + '\n');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'allow-unauthenticated=' + !!s.allowUnauthenticated + '\n');
          "

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      # gym-service footgun guard — CI port of .claude/commands/deploy.md's
      # manual "/health before router" check (regressed once already, 3b3def4).
      - if: steps.svcmeta.outputs.health-guard == 'true'
        run: node deploy/scripts/check-gym-health-route-order.cjs

      # Prisma migrations run from the runner (DB is externally reachable,
      # not Cloud SQL) BEFORE the new revision is deployed. Guard on the
      # migrations dir existing — gym-service/buddy-service don't have one
      # yet, and `prisma migrate deploy` errors on a missing dir rather than
      # no-op'ing.
      - if: steps.svcmeta.outputs.has-prisma == 'true'
        id: dbsecret
        uses: google-github-actions/get-secretmanager-secrets@v2
        with:
          secrets: |-
            DATABASE_URL:${{ vars.GCP_PROJECT_ID }}/db-url-${{ steps.env.outputs.ENV }}

      - if: steps.svcmeta.outputs.has-prisma == 'true'
        working-directory: ${{ steps.svcmeta.outputs.source-dir }}
        env:
          DATABASE_URL: ${{ steps.dbsecret.outputs.DATABASE_URL }}
        run: |
          if [ -d "prisma/migrations" ]; then
            npm ci
            npx prisma migrate deploy
          else
            echo "No prisma/migrations directory for ${{ matrix.service }} yet — skipping migrate deploy."
          fi

      - id: flags
        run: node deploy/scripts/build-deploy-flags.cjs "${{ matrix.service }}" "${{ steps.env.outputs.ENV }}"

      - id: prev-revision
        run: |
          PREV=$(gcloud run services describe "${{ matrix.service }}-${{ steps.env.outputs.ENV }}" \
            --project="${{ vars.GCP_PROJECT_ID }}" --region="${{ vars.GCP_REGION }}" \
            --format="value(status.traffic[0].revisionName)" 2>/dev/null || echo "")
          echo "revision=$PREV" >> "$GITHUB_OUTPUT"

      # Only the gateway is meant to be publicly invokable — every backend
      # service should reject unauthenticated Cloud Run ingress entirely,
      # with the app-layer x-internal-key check as a second, independent
      # layer on top, not instead of this one. This used to be unconditional
      # `--allow-unauthenticated` for every service in the matrix (gateway
      # included), which silently re-opened public access to every backend
      # service on every single deploy — the culprit behind IAM lockdown
      # "regressing" despite never being reverted on purpose. Driven by
      # deploy/services.json's allowUnauthenticated flag (true only for
      # gateway) so this can never drift service-by-service again.
      - id: deploy
        run: |
          gcloud run deploy "${{ matrix.service }}-${{ steps.env.outputs.ENV }}" \
            --source="${{ steps.svcmeta.outputs.source-dir }}" \
            --project="${{ vars.GCP_PROJECT_ID }}" --region="${{ vars.GCP_REGION }}" \
            $([ "${{ steps.svcmeta.outputs.allow-unauthenticated }}" = "true" ] && echo --allow-unauthenticated || echo --no-allow-unauthenticated) \
            --quiet \
            --set-env-vars="${{ steps.flags.outputs.env-vars }}" \
            --set-secrets="${{ steps.flags.outputs.secrets }}"

      # `gcloud run deploy` only auto-shifts 100% traffic to the new revision
      # when the service is still in "always use latest" mode. A prior
      # rollback (`update-traffic --to-revisions=<name>=100`) pins traffic to
      # a named revision and takes the service OUT of that mode permanently —
      # every deploy after that point silently lands at 0% traffic otherwise
      # (confirmed: https://cloud.google.com/sdk/gcloud/reference/run/deploy
      # --no-traffic docs describe the same pinning side effect). Force it
      # back explicitly on every deploy so a prior rollback never leaves
      # future deploys stuck serving stale code — and so the health check
      # below actually tests the revision we just built, not whatever
      # revision happened to be pinned.
      - id: shift-traffic
        run: |
          gcloud run services update-traffic "${{ matrix.service }}-${{ steps.env.outputs.ENV }}" \
            --project="${{ vars.GCP_PROJECT_ID }}" --region="${{ vars.GCP_REGION }}" \
            --to-latest

      # Cloud Run URLs embed a per-project/region hash — resolve the live
      # URL, then mint an audience-scoped identity token via the auth action.
      # WIF external-account creds can't do `gcloud auth print-identity-token
      # --audiences <url>` (gcloud: "Invalid account type"), so the action is
      # re-invoked with token_format=id_token and the service URL as
      # audience — the only reliable way to satisfy the IAM invoker check on
      # locked-down (no-allow-unauthenticated) services. The per-env
      # health-check providers exist because a provider is capped at 10
      # allowed audiences and we have 6 services x 2 envs (12 run.app URLs).
      - id: svcurl
        run: |
          URL=$(gcloud run services describe "${{ matrix.service }}-${{ steps.env.outputs.ENV }}" \
            --project="${{ vars.GCP_PROJECT_ID }}" --region="${{ vars.GCP_REGION }}" \
            --format="value(status.url)")
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - id: healthauth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ steps.env.outputs.ENV == 'prod' && vars.GCP_WIF_PROVIDER_HEALTH_PROD || vars.GCP_WIF_PROVIDER_HEALTH_DEV }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}
          token_format: 'id_token'
          audience: ${{ steps.svcurl.outputs.url }}

      - id: healthcheck
        env:
          HEALTH_URL: ${{ steps.svcurl.outputs.url }}/health
          HEALTH_TOKEN: ${{ steps.healthauth.outputs.id_token }}
        run: node deploy/scripts/verify-health.cjs "${{ matrix.service }}" "${{ steps.env.outputs.ENV }}"

      - if: failure() && steps.healthcheck.outcome == 'failure' && steps.prev-revision.outputs.revision != ''
        run: |
          gcloud run services update-traffic "${{ matrix.service }}-${{ steps.env.outputs.ENV }}" \
            --project="${{ vars.GCP_PROJECT_ID }}" --region="${{ vars.GCP_REGION }}" \
            --to-revisions="${{ steps.prev-revision.outputs.revision }}=100"
          echo "::error::Health check failed — rolled back ${{ matrix.service }}-${{ steps.env.outputs.ENV }} to ${{ steps.prev-revision.outputs.revision }}"
          exit 1
