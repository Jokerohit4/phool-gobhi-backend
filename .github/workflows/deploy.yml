name: Deploy to Cloud Run
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.one_plan_data != '' && inputs.one_plan_data != 'deploy' && format('One Plan dev data {0}', inputs.one_plan_data) || format('Deploy {0}', github.sha) }}

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
    # Manual deploy of every changed service on the chosen ref. The
    # detect-changed-services step gets an empty `before` for this event, so
    # it treats all services as changed — an explicit full redeploy.
    inputs:
      ref:
        description: 'Branch or commit SHA to deploy (default: current branch)'
        required: false
      one_plan_data:
        description: 'Dev-only One Plan data action; deploy retains normal deployment behavior'
        type: choice
        options: [deploy, dry-run, apply]
        default: deploy
      expected_sha:
        description: 'Exact deployed dev SHA for a data action'
        required: false
      log_view:
        description: 'Explicit dev-job log view resource for a data action'
        required: false

permissions:
  contents: read
  id-token: write   # required for google-github-actions/auth (WIF)

jobs:
  changes:
    if: github.event_name != 'workflow_dispatch' || !inputs.one_plan_data || inputs.one_plan_data == 'deploy'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      any: ${{ steps.detect.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: refs
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "base=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - id: detect
        run: node deploy/scripts/detect-changed-services.cjs "${{ steps.refs.outputs.base }}" "${{ steps.refs.outputs.head }}"

  unit-tests:
    needs: changes
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      # Resolve the service's real directory from deploy/services.json, exactly
      # like the deploy job does — `matrix.service` alone is just the manifest
      # key, not a path (e.g. "booking-service" lives at "services/booking-service").
      - id: svcmeta
        run: |
          node -e "
            const s = require('./deploy/services.json').services['${{ matrix.service }}'];
            require('fs').appendFileSync(process.env.GITHUB_OUTPUT, 'source-dir=' + s.sourceDir + '\n');
          "
      - uses: actions/setup-node@v4
        with:
          # The dev toolchain (and these tests, which use Node's experimental
          # test module-mocks to stub @prisma/client) runs on Node 24; Node 20's
          # mock loader cannot intercept the dual-published client's named
          # exports, so every service suite failed under 20. Production still
          # builds from node:20-alpine in its own Dockerfile.
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: '${{ steps.svcmeta.outputs.source-dir }}/package-lock.json'
      - name: Install and test
        run: |
          cd "${{ steps.svcmeta.outputs.source-dir }}"
          npm ci
          # A service that uses Prisma needs its client generated: on a fresh
          # checkout @prisma/client ships no PrismaClient export until "prisma
          # generate" runs against its schema. Only run it when the project
          # actually depends on prisma — "npx prisma" on a service that does
          # not (like the root gateway) would fetch the latest release instead.
          if [ -d "node_modules/prisma" ]; then npx prisma generate; fi
          # Every changed service now defines a test script (the root gateway
          # included); the guard below stays as a cheap tolerance for a
          # future service that lands with no suite yet.
          if [ "$(node -p "!!require('./package.json').scripts && !!require('./package.json').scripts.test")" = "true" ]; then
            npm test
          fi

  # Real-database tests, against a real Postgres.
  #
  # The unit suite mocks Prisma, which is correct for logic and wrong for the
  # things only Postgres can answer: a TEXT column holding 'YYYY-MM-DD' compared
  # with `gte`, and an enum value that is accepted by the service and refused by
  # the database. A mock agrees with both by construction, so those failures
  # would otherwise ship and only show up as a 500 on the settings screen.
  #
  # Deliberately NOT gated on the changed-service matrix. A skipped job skips
  # everything downstream in `needs`, so making this conditional would mean
  # either never gating the deploy (advisory only) or rewriting the deploy
  # job's condition. It costs one container, so it always runs and the gate is
  # real. Only health-service has such tests today; the suite skips itself for
  # anything else.
  integration-tests:
    needs: changes
    runs-on: ubuntu-latest
    services:
      postgres:
        # 16 matches what Neon serves in production, which is the point: the
        # text-comparison and enum behaviour under test is version-specific.
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: health_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/health_test
      # Prisma reads DATABASE_URL from the schema; the tests read
      # TEST_DATABASE_URL and set DATABASE_URL from it before importing the
      # service, which builds its client at import time.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/health_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'services/health-service/package-lock.json'
      - name: Install, generate client, apply migrations
        working-directory: services/health-service
        run: |
          npm ci
          npx prisma generate
          # Without this every query fails on a missing relation rather than on
          # the thing being tested.
          npx prisma migrate deploy
          # The food tests assert against the seeded catalogue, and the search
          # bugs they exist to catch were only ever visible against real data:
          # "tea" matched "Momos, steamed" because plain `includes` cannot tell a
          # word from the middle of a longer one, and no mocked fixture contained
          # the word "steamed". Idempotent, so re-running it on a warm database
          # updates rather than duplicating.
          npx prisma db seed
      - name: Run the real-database tests
        working-directory: services/health-service
        run: node --test test/nudgeDb.test.js test/foodDb.test.js
      # The drift audit normally needs a real environment and so cannot gate a
      # pull request. Against the database this job just built it can, and that is
      # the only place the index and column-default checks ever run - the four
      # items it now reports were invisible to the previous version of the script
      # for as long as it existed.
      - name: Audit the schema against the database just migrated
        working-directory: services/health-service
        run: node scripts/check-schema-drift.mjs
        env:
          # Named DEV_ on purpose: a script reading DATABASE_URL picks up whatever
          # the shell happens to have. The CI Postgres has no TLS, hence
          # sslmode=disable.
          DEV_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}?sslmode=disable

  preflight:
    needs: [changes, unit-tests, integration-tests]
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The analytics-drift-check script/registry may not exist yet on every
      # branch (it landed on dev first) — treat its absence as "not
      # applicable here yet", not a reason to block every future deploy on
      # this branch until it's merged.
      - run: |
          if [ -f "scripts/check-analytics-events.cjs" ]; then
            node scripts/check-analytics-events.cjs
          else
            echo "scripts/check-analytics-events.cjs not present on this branch — skipping."
          fi

      # An undeclared import builds fine and then exits(1) on boot, so the
      # deploy fails at "container failed to start and listen on PORT" with
      # the real cause buried in Cloud Logging. Cheap to check here, expensive
      # to diagnose there. Guarded the same way as the analytics check above:
      # absent on a branch means not-applicable, not a permanent block.
      - run: |
          if [ -f "deploy/scripts/check-undeclared-imports.cjs" ]; then
            node deploy/scripts/check-undeclared-imports.cjs
          else
            echo "deploy/scripts/check-undeclared-imports.cjs not present on this branch — skipping."
          fi

  # PR events never deploy (the WIF provider's attribute-condition wouldn't
  # accept a PR merge ref anyway) — instead just prove each changed service's
  # Dockerfile still builds, catching a broken install/`prisma generate`
  # before merge with zero GCP access needed.
  build-validate:
    needs: [changes, unit-tests]
    if: github.event_name == 'pull_request' && needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - id: svcmeta
        run: |
          node -e "
            const s = require('./deploy/services.json').services['${{ matrix.service }}'];
            require('fs').appendFileSync(process.env.GITHUB_OUTPUT, 'source-dir=' + s.sourceDir + '\n');
          "
      - run: docker build -f "${{ steps.svcmeta.outputs.source-dir }}/Dockerfile" "${{ steps.svcmeta.outputs.source-dir }}"

  deploy:
    needs: [changes, preflight]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'dev' }}
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.matrix) }}
    concurrency:
      group: deploy-${{ matrix.service }}-${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - id: env
        run: echo "ENV=${{ github.ref_name == 'main' && 'prod' || 'dev' }}" >> "$GITHUB_OUTPUT"

      - id: svcmeta
        run: |
          node -e "
            const s = require('./deploy/services.json').services['${{ matrix.service }}'];
            const fs = require('fs');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'source-dir=' + s.sourceDir + '\n');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'has-prisma=' + !!s.hasPrisma + '\n');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'health-guard=' + !!s.healthCheckGuard + '\n');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'allow-unauthenticated=' + !!s.allowUnauthenticated + '\n');
          "

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      # health-before-router footgun guard — CI port of .claude/commands/deploy.md's
      # manual check (regressed once already for gym-service, 3b3def4). Any service
      # with healthCheckGuard=true gets validated.
      - if: steps.svcmeta.outputs.health-guard == 'true'
        run: node deploy/scripts/check-gym-health-route-order.cjs ${{ matrix.service }}

      # Prisma migrations run from the runner (DB is externally reachable,
      # not Cloud SQL) BEFORE the new revision is deployed. Guard on the
      # migrations dir existing — gym-service/buddy-service don't have one
      # yet, and `prisma migrate deploy` errors on a missing dir rather than
      # no-op'ing.
      # DATABASE_URL now lives inside the consolidated <service>-secrets-<env>
      # JSON payload (see deploy/README.md's "Consolidated secrets" section),
      # not as its own Secret Manager entry — the old db-url-<env> secrets
      # were deleted 2026-08-26 as part of that migration.
      - if: steps.svcmeta.outputs.has-prisma == 'true'
        id: dbsecret
        uses: google-github-actions/get-secretmanager-secrets@v2
        with:
          secrets: |-
            SECRETS_JSON:${{ vars.GCP_PROJECT_ID }}/${{ matrix.service }}-secrets-${{ steps.env.outputs.ENV }}

      - if: steps.svcmeta.outputs.has-prisma == 'true'
        id: dburl
        env:
          SECRETS_JSON: ${{ steps.dbsecret.outputs.SECRETS_JSON }}
        run: |
          URL=$(echo "$SECRETS_JSON" | jq -r '.DATABASE_URL')
          echo "::add-mask::$URL"
          echo "database-url=$URL" >> "$GITHUB_OUTPUT"

      - if: steps.svcmeta.outputs.has-prisma == 'true'
        working-directory: ${{ steps.svcmeta.outputs.source-dir }}
        env:
          DATABASE_URL: ${{ steps.dburl.outputs.database-url }}
        run: |
          if [ -d "prisma/migrations" ]; then
            npm ci
            npx prisma migrate deploy
          else
            echo "No prisma/migrations directory for ${{ matrix.service }} yet — skipping migrate deploy."
          fi

      - id: flags
        run: node deploy/scripts/build-deploy-flags.cjs "${{ matrix.service }}" "${{ steps.env.outputs.ENV }}"

      - id: prev-revision
        run: |
          PREV=$(gcloud run services describe "${{ matrix.service }}-${{ steps.env.outputs.ENV }}" \
            --project="${{ vars.GCP_PROJECT_ID }}" --region="${{ vars.GCP_REGION }}" \
            --format="value(status.traffic[0].revisionName)" 2>/dev/null || echo "")
          echo "revision=$PREV" >> "$GITHUB_OUTPUT"

      # Only the gateway is meant to be publicly invokable — every backend
      # service should reject unauthenticated Cloud Run ingress entirely,
      # with the app-layer x-internal-key check as a second, independent
      # layer on top, not instead of this one. This used to be unconditional
      # `--allow-unauthenticated` for every service in the matrix (gateway
      # included), which silently re-opened public access to every backend
      # service on every single deploy — the culprit behind IAM lockdown
      # "regressing" despite never being reverted on purpose. Driven by
      # deploy/services.json's allowUnauthenticated flag (true only for
      # gateway) so this can never drift service-by-service again.
      - id: deploy
        run: |
          gcloud run deploy "${{ matrix.service }}-${{ steps.env.outputs.ENV }}" \
            --source="${{ steps.svcmeta.outputs.source-dir }}" \
            --project="${{ vars.GCP_PROJECT_ID }}" --region="${{ vars.GCP_REGION }}" \
            $([ "${{ steps.svcmeta.outputs.allow-unauthenticated }}" = "true" ] && echo --allow-unauthenticated || echo --no-allow-unauthenticated) \
            --quiet \
            --service-account="${{ steps.flags.outputs.service-account }}" \
            --set-env-vars="${{ steps.flags.outputs.env-vars }}" \
            --set-secrets="${{ steps.flags.outputs.secrets }}"

      # `gcloud run deploy` only auto-shifts 100% traffic to the new revision
      # when the service is still in "always use latest" mode. A prior
      # rollback (`update-traffic --to-revisions=<name>=100`) pins traffic to
      # a named revision and takes the service OUT of that mode permanently —
      # every deploy after that point silently lands at 0% traffic otherwise
      # (confirmed: https://cloud.google.com/sdk/gcloud/reference/run/deploy
      # --no-traffic docs describe the same pinning side effect). Force it
      # back explicitly on every deploy so a prior rollback never leaves
      # future deploys stuck serving stale code — and so the health check
      # below actually tests the revision we just built, not whatever
      # revision happened to be pinned.
      - id: shift-traffic
        run: |
          gcloud run services update-traffic "${{ matrix.service }}-${{ steps.env.outputs.ENV }}" \
            --project="${{ vars.GCP_PROJECT_ID }}" --region="${{ vars.GCP_REGION }}" \
            --to-latest

      # Cloud Run URLs embed a per-project/region hash — resolve the live
      # URL, then mint an audience-scoped identity token via the auth action.
      # WIF external-account creds can't do `gcloud auth print-identity-token
      # --audiences <url>` (gcloud: "Invalid account type"), so the action is
      # re-invoked with token_format=id_token and the service URL as
      # audience — the only reliable way to satisfy the IAM invoker check on
      # locked-down (no-allow-unauthenticated) services. The per-env
      # health-check providers exist because a provider is capped at 10
      # allowed audiences and we have 6 services x 2 envs (12 run.app URLs).
      - id: svcurl
        run: |
          URL=$(gcloud run services describe "${{ matrix.service }}-${{ steps.env.outputs.ENV }}" \
            --project="${{ vars.GCP_PROJECT_ID }}" --region="${{ vars.GCP_REGION }}" \
            --format="value(status.url)")
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - id: healthauth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ steps.env.outputs.ENV == 'prod' && vars.GCP_WIF_PROVIDER_HEALTH_PROD || vars.GCP_WIF_PROVIDER_HEALTH_DEV }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}
          token_format: 'id_token'
          id_token_audience: ${{ steps.svcurl.outputs.url }}

      - id: healthcheck
        env:
          HEALTH_URL: ${{ steps.svcurl.outputs.url }}/health
          HEALTH_TOKEN: ${{ steps.healthauth.outputs.id_token }}
        run: node deploy/scripts/verify-health.cjs "${{ matrix.service }}" "${{ steps.env.outputs.ENV }}"

      - if: failure() && steps.healthcheck.outcome == 'failure' && steps.prev-revision.outputs.revision != ''
        run: |
          gcloud run services update-traffic "${{ matrix.service }}-${{ steps.env.outputs.ENV }}" \
            --project="${{ vars.GCP_PROJECT_ID }}" --region="${{ vars.GCP_REGION }}" \
            --to-revisions="${{ steps.prev-revision.outputs.revision }}=100"
          echo "::error::Health check failed — rolled back ${{ matrix.service }}-${{ steps.env.outputs.ENV }} to ${{ steps.prev-revision.outputs.revision }}"
          exit 1

  one-plan-dev-data:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev' && (inputs.one_plan_data == 'dry-run' || inputs.one_plan_data == 'apply')
    concurrency:
      group: one-plan-dev-data
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Verify requested dev revision
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          LOG_VIEW_RESOURCE: ${{ inputs.log_view }}
        run: |
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          [[ "$LOG_VIEW_RESOURCE" =~ ^projects/phool-gobhi/locations/[a-z0-9-]+/buckets/_Default/views/one-plan-dev-data$ ]]

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}
      - uses: google-github-actions/setup-gcloud@v2

      - name: Resolve deployed dev image and job environment
        id: config
        run: |
          gcloud run services describe health-service-dev --project=phool-gobhi --region=asia-south1 \
            --format=json > "$RUNNER_TEMP/health-service-dev.json"
          REVISION=$(node -p "const s=require(process.env.RUNNER_TEMP+'/health-service-dev.json'); if(s.status.latestReadyRevisionName!==s.status.latestCreatedRevisionName || !s.status.traffic.some(t=>t.revisionName===s.status.latestReadyRevisionName && t.percent===100)) throw Error('Dev revision is not Ready at 100% traffic'); s.status.latestReadyRevisionName")
          gcloud run revisions describe "$REVISION" --project=phool-gobhi --region=asia-south1 \
            --format=json > "$RUNNER_TEMP/health-revision.json"
          node <<'NODE'
          const fs = require('node:fs');
          const manifest = require('./deploy/services.json');
          const service = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/health-service-dev.json'));
          const revision = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/health-revision.json'));
          const image = revision.status.imageDigest;
          if (!image || !image.includes('@sha256:')) throw Error('An immutable deployed image is required');
          const account = manifest.runtimeServiceAccounts.dev;
          if (service.spec.template.spec.serviceAccountName !== account) throw Error('Unexpected dev runtime identity');
          const secret = service.spec.template.spec.containers[0].env.find(v => v.name === 'SECRETS_JSON');
          if (secret?.valueFrom?.secretKeyRef?.name !== 'health-service-secrets-dev') throw Error('Unexpected dev secret binding');
          const env = {...manifest.services['health-service'].env.dev.plain,
            ANALYTICS_PROVIDER: 'none', ONE_PLAN_MIGRATION_ENV: 'dev'};
          fs.writeFileSync(process.env.RUNNER_TEMP+'/one-plan-dev-env.json', JSON.stringify(env));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `image=${image}\naccount=${account}\nrevision=${service.status.latestReadyRevisionName}\n`);
          NODE

      - name: Run dev-only data verification job
        env:
          IMAGE: ${{ steps.config.outputs.image }}
          RUNTIME_ACCOUNT: ${{ steps.config.outputs.account }}
          APPLY: ${{ inputs.one_plan_data == 'apply' }}
        run: |
          ARGS="--import=./bootstrap-secrets.js,scripts/prepareOnePlanDev.js"
          if [ "$APPLY" = true ]; then ARGS="$ARGS,--apply"; fi
          gcloud run jobs deploy one-plan-dev-data --project=phool-gobhi --region=asia-south1 \
            --image="$IMAGE" --service-account="$RUNTIME_ACCOUNT" --command=node --args="$ARGS" \
            --env-vars-file="$RUNNER_TEMP/one-plan-dev-env.json" \
            --set-secrets=SECRETS_JSON=health-service-secrets-dev:latest \
            --tasks=1 --parallelism=1 --max-retries=0 --task-timeout=1800s --memory=512Mi --cpu=1 --quiet
          gcloud run jobs execute one-plan-dev-data --project=phool-gobhi --region=asia-south1 \
            --wait --format=json > "$RUNNER_TEMP/one-plan-dev-execution.json"

      - name: Capture structured verification report
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          APPLY: ${{ inputs.one_plan_data == 'apply' }}
          REVISION: ${{ steps.config.outputs.revision }}
          IMAGE: ${{ steps.config.outputs.image }}
          LOG_VIEW_RESOURCE: ${{ inputs.log_view }}
        run: |
          EXECUTION=$(node -p "require(process.env.RUNNER_TEMP+'/one-plan-dev-execution.json').metadata.name.split('/').pop()")
          for attempt in $(seq 1 24); do
            if ! gcloud logging read \
              "resource.type=cloud_run_job AND resource.labels.job_name=one-plan-dev-data AND labels.\"run.googleapis.com/execution_name\"=\"$EXECUTION\" AND textPayload:\"ONE_PLAN_DEV_RESULT=\"" \
              --project=phool-gobhi --resource-names="$LOG_VIEW_RESOURCE" \
              --limit=5 --format=json > "$RUNNER_TEMP/one-plan-dev-result-logs.json"; then
              # A newly granted view binding may take time to propagate.
              sleep 5
              continue
            fi
            if node -e "const r=require(process.env.RUNNER_TEMP+'/one-plan-dev-result-logs.json'); process.exit(r.some(x=>x.textPayload?.includes('ONE_PLAN_DEV_RESULT='))?0:1)"; then break; fi
            sleep 5
          done
          node <<'NODE'
          const fs = require('node:fs');
          const entries = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/one-plan-dev-result-logs.json'));
          const entry = entries.find(x => x.textPayload?.includes('ONE_PLAN_DEV_RESULT='));
          if (!entry) throw Error('No completed migration report found; acceptance remains unverified');
          const report = JSON.parse(entry.textPayload.split('ONE_PLAN_DEV_RESULT=')[1]);
          const apply = process.env.APPLY === 'true';
          if (report.mode !== (apply ? 'apply' : 'dry-run') || report.dryRun.errors.length || (apply && !report.verified)) throw Error('Migration acceptance failed');
          fs.writeFileSync(process.env.RUNNER_TEMP+'/one-plan-dev-data.json', JSON.stringify({sha:process.env.EXPECTED_SHA,
            revision:process.env.REVISION,image:process.env.IMAGE,report},null,2));
          console.log(JSON.stringify(report,null,2));
          NODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: one-plan-dev-data-${{ inputs.one_plan_data }}
          path: |
            ${{ runner.temp }}/one-plan-dev-data.json
            ${{ runner.temp }}/one-plan-dev-execution.json
          retention-days: 7
