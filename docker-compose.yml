version: '3.8'

services:
  gateway:
    build: .
    ports:
      - "5050:5000"
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - AUTH_SERVICE_URL=http://auth-service:5001
      - WALLET_SERVICE_URL=http://wallet-service:5003
      - GYM_SERVICE_URL=http://gym-service:5004
      - BOOKING_SERVICE_URL=http://booking-service:5005
      - BUDDY_SERVICE_URL=http://buddy-service:5007
      - CHALLENGE_SERVICE_URL=http://challenge-service:5008
      - ANALYTICS_PROVIDER=${ANALYTICS_PROVIDER}
      - ANALYTICS_DATABASE_URL=${ANALYTICS_DATABASE_URL}
      - ANALYTICS_SERVICE_NAME=gateway
    depends_on:
      - auth-service
      - wallet-service
      - gym-service
      - booking-service
      - buddy-service
      - challenge-service
    networks:
      - phool-gobhi-net
    restart: on-failure

  auth-service:
    build: ./services/auth-service
    environment:
      - DATABASE_URL=postgresql://pguser:pgpass@postgres:5432/authdb
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - AUTH_SERVICE_PORT=5001
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      # Outbound fire-and-forget call to keep buddy-service's denormalized
      # profile cache in sync (see controllers/userProfileController.js).
      - BUDDY_SERVICE_URL=http://buddy-service:5007
      # Outbound call to credit the one-time ₹20 profile-completion bonus
      # (see controllers/userProfileController.js).
      - WALLET_SERVICE_URL=http://wallet-service:5003
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - ANALYTICS_PROVIDER=${ANALYTICS_PROVIDER}
      - ANALYTICS_DATABASE_URL=${ANALYTICS_DATABASE_URL}
      - ANALYTICS_SERVICE_NAME=auth-service
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - phool-gobhi-net
    restart: on-failure

  wallet-service:
    build: ./services/wallet-service
    environment:
      - DATABASE_URL=postgresql://pguser:pgpass@postgres:5432/walletdb
      - WALLET_SERVICE_PORT=5003
      - CHALLENGE_SERVICE_URL=http://challenge-service:5008
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_SECRET=${RAZORPAY_SECRET}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET}
      - ANALYTICS_PROVIDER=${ANALYTICS_PROVIDER}
      - ANALYTICS_DATABASE_URL=${ANALYTICS_DATABASE_URL}
      - ANALYTICS_SERVICE_NAME=wallet-service
    depends_on:
      postgres:
        condition: service_healthy
      challenge-service:
        condition: service_started
    networks:
      - phool-gobhi-net
    restart: on-failure

  gym-service:
    build: ./services/gym-service
    environment:
      - DATABASE_URL=postgresql://pguser:pgpass@postgres:5432/gymdb
      - GYM_SERVICE_PORT=5004
      - BOOKING_SERVICE_URL=http://booking-service:5005
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - ANALYTICS_PROVIDER=${ANALYTICS_PROVIDER}
      - ANALYTICS_DATABASE_URL=${ANALYTICS_DATABASE_URL}
      - ANALYTICS_SERVICE_NAME=gym-service
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - phool-gobhi-net
    restart: on-failure

  booking-service:
    build: ./services/booking-service
    environment:
      - DATABASE_URL=postgresql://pguser:pgpass@postgres:5432/bookingdb
      - BOOKING_SERVICE_PORT=5005
      - WALLET_SERVICE_URL=http://wallet-service:5003
      - GYM_SERVICE_URL=http://gym-service:5004
      - CHALLENGE_SERVICE_URL=http://challenge-service:5008
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - FIREBASE_SERVICE_ACCOUNT_JSON=${FIREBASE_SERVICE_ACCOUNT_JSON}
      - ANALYTICS_PROVIDER=${ANALYTICS_PROVIDER}
      - ANALYTICS_DATABASE_URL=${ANALYTICS_DATABASE_URL}
      - ANALYTICS_SERVICE_NAME=booking-service
    depends_on:
      postgres:
        condition: service_healthy
      wallet-service:
        condition: service_started
      gym-service:
        condition: service_started
      challenge-service:
        condition: service_started
    networks:
      - phool-gobhi-net
    restart: on-failure

  buddy-service:
    build: ./services/buddy-service
    environment:
      - DATABASE_URL=postgresql://pguser:pgpass@postgres:5432/buddydb
      - BUDDY_SERVICE_PORT=5007
      - AUTH_SERVICE_URL=http://auth-service:5001
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - FIREBASE_SERVICE_ACCOUNT_JSON=${FIREBASE_SERVICE_ACCOUNT_JSON}
      - ANALYTICS_PROVIDER=${ANALYTICS_PROVIDER}
      - ANALYTICS_DATABASE_URL=${ANALYTICS_DATABASE_URL}
      - ANALYTICS_SERVICE_NAME=buddy-service
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - phool-gobhi-net
    restart: on-failure

  challenge-service:
    build: ./services/challenge-service
    environment:
      - DATABASE_URL=postgresql://pguser:pgpass@postgres:5432/challengedb
      - CHALLENGE_SERVICE_PORT=5008
      - AUTH_SERVICE_URL=http://auth-service:5001
      - BOOKING_SERVICE_URL=http://booking-service:5005
      - BUDDY_SERVICE_URL=http://buddy-service:5007
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - ANALYTICS_PROVIDER=${ANALYTICS_PROVIDER}
      - ANALYTICS_DATABASE_URL=${ANALYTICS_DATABASE_URL}
      - ANALYTICS_SERVICE_NAME=challenge-service
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - phool-gobhi-net
    restart: on-failure

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: pguser
      POSTGRES_PASSWORD: pgpass
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - phool-gobhi-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pguser"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  phool-gobhi-net:
    driver: bridge

volumes:
  postgres_data:
