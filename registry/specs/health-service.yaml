openapi: 3.0.0
info:
  title: Phool Gobhi Health Service
  version: 1.1.0
  description: API for structured workout logging, biometric tracking, and AI-driven preventive health.

paths:
  # --- Workouts ---
  /sessions:
    post:
      summary: Start or log a workout session
      tags: [Workouts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkoutSessionRequest'
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutSession'

  /sessions/{id}/exercises:
    post:
      summary: Add an exercise to a session
      tags: [Workouts]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionExerciseRequest'
      responses:
        '201':
          description: Exercise added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionExercise'

  # --- Health Ledger & Score ---
  /ledger/score:
    get:
      summary: Get the historical health score series
      tags: [Ledger]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 90 }
      responses:
        '200':
          description: Score series returned
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DailyScore' }

  /ledger/score/blended:
    get:
      summary: Get the current blended health score
      tags: [Ledger]
      responses:
        '200':
          description: Blended score returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BlendedScore' }

  /ledger/score/preview/{localDate}:
    get:
      summary: Preview today's running score
      tags: [Ledger]
      parameters:
        - name: localDate
          in: path
          required: true
          schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
      responses:
        '200':
          description: Preview returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DailyScore' }

  /ledger/score/{localDate}/close:
    post:
      summary: Freeze a day's score into a snapshot
      tags: [Ledger]
      parameters:
        - name: localDate
          in: path
          required: true
          schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
      responses:
        '200':
          description: Day closed successfully
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DailyScore' }

  # --- AI Prescriber ---
  /ledger/ai/prescribe:
    post:
      summary: Inject an AI-suggested health plan
      tags: [AI]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AiPrescription' }
      responses:
        '200':
          description: Plan injected
          content:
            application/json:
              schema:
                type: object
                properties:
                  planItemsCreated: { type: integer }
                  templatesCreated: { type: integer }

  # --- Biological State & Trajectories ---
  /ledger/biometrics/trajectory:
    get:
      summary: Get verified history for a specific biomarker
      tags: [Biological]
      parameters:
        - name: marker
          in: query
          required: true
          schema: { type: string }
        - name: days
          in: query
          schema: { type: integer, default: 90 }
      responses:
        '200':
          description: Trajectory points returned
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BiomarkerPoint' }

  /ledger/biometrics/correlation:
    get:
      summary: Correlate biomarker improvement with AI plans
      tags: [Biological]
      parameters:
        - name: marker
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Correlation insight returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarkerCorrelation' }

  # --- Gamification ---
  /ledger/rewards/evaluate:
    post:
      summary: Evaluate consistency rewards for the user
      tags: [Gamification]
      responses:
        '200':
          description: Reward result returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [rewarded, ignored, failed] }
                  score: { type: number }

  # --- Medical Vault ---
  /ledger/documents:
    get:
      summary: List user's medical documents
      tags: [Vault]
      responses:
        '200':
          description: Document list returned
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MedicalDocument' }

  /ledger/documents/upload:
    post:
      summary: Upload a new lab report
      tags: [Vault]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
                kind: { type: string, enum: [blood, urine, other] }
                title: { type: string }
      responses:
        '201':
          description: Document uploaded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MedicalDocument' }

components:
  schemas:
    # --- Core Workout Models ---
    WorkoutSession:
      type: object
      properties:
        id: { type: integer }
        userId: { type: integer }
        templateId: { type: integer, nullable: true }
        bookingId: { type: integer, nullable: true }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time, nullable: true }
        type: { type: string, enum: [strength, cardio, hiit, yoga_mobility, full_body, rest] }
        rpe: { type: integer, nullable: true, minimum: 1, maximum: 10 }

    WorkoutSessionRequest:
      type: object
      required: [userId, type]
      properties:
        userId: { type: integer }
        templateId: { type: integer, nullable: true }
        bookingId: { type: integer, nullable: true }
        type: { type: string, enum: [strength, cardio, hiit, yoga_mobility, full_body, rest] }

    SessionExercise:
      type: object
      properties:
        id: { type: integer }
        sessionId: { type: integer }
        exerciseId: { type: integer }
        order: { type: integer }

    SessionExerciseRequest:
      type: object
      required: [exerciseId]
      properties:
        exerciseId: { type: integer }
        order: { type: integer }

    # --- Ledger Models ---
    DailyScore:
      type: object
      properties:
        localDate: { type: string, format: date }
        open: { type: number }
        high: { type: number }
        low: { type: number }
        close: { type: number }
        breakdown:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              label: { type: string }
              kind: { type: string }
              points: { type: number }

    BlendedScore:
      type: object
      properties:
        blendedScore: { type: integer }
        behavioralScore: { type: integer }
        biologicalScore: { type: integer, nullable: true }
        markers:
          type: array
          items:
            type: object
            properties:
              marker: { type: string }
              value: { type: number }

    AiPrescription:
      type: object
      properties:
        planItems:
          type: array
          items:
            type: object
            properties:
              title: { type: string }
              kind: { type: string }
              schedule: { type: string }
        suggestedTemplates:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              category: { type: string, nullable: true }
              exercises:
                type: array
                items:
                  type: object
                  properties:
                    exerciseId: { type: integer }
                    targetSets: { type: integer }
                    targetReps: { type: integer }
                    targetWeight: { type: number, nullable: true }
                    restSeconds: { type: integer, nullable: true }

    # --- Biological Models ---
    BiomarkerPoint:
      type: object
      properties:
        date: { type: string, format: date }
        value: { type: number }

    MarkerCorrelation:
      type: object
      properties:
        marker: { type: string }
        improvement: { type: number }
        direction: { type: string, enum: [increase, decrease] }
        correlatedPlan: { type: string }
        insight: { type: string }
        confidence: { type: string, enum: [low, medium, high] }

    # --- Vault Models ---
    MedicalDocument:
      type: object
      properties:
        id: { type: integer }
        userId: { type: integer }
        title: { type: string }
        kind: { type: string }
        url: { type: string }
        createdAt: { type: string, format: date-time }
