# PostgreSQL connection
# IMPORTANT: Use environment variables or application-local.properties for sensitive data
# Never commit credentials to version control!
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server port
server.port=8082

# Razorpay Configuration
# Get your test keys from: https://dashboard.razorpay.com/app/keys
# Test Key ID and Test Key Secret from Settings > API Keys
# IMPORTANT: Use environment variables or application-local.properties for sensitive data
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}

# Webhook Secret from Razorpay Dashboard > Settings > Webhooks
# Configure webhook URL as: https://your-ngrok-url.ngrok-free.app/api/payment/webhook
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:}