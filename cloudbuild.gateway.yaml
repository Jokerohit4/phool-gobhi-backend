# Cloud Build trigger config for the gateway. Same file is used by both the
# dev and prod GCP projects' triggers (dev project's trigger watches the
# `dev` branch, prod project's trigger watches `main`) — $PROJECT_ID resolves
# automatically to whichever project the trigger runs in, so no per-env
# duplication is needed here.
#
# One-time setup this depends on (Phase 0): an Artifact Registry Docker repo
# named "phool-gobhi" must exist in each project:
#   gcloud artifacts repositories create phool-gobhi --repository-format=docker --location=asia-south1 --project=<project-id>
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/gateway:$SHORT_SHA', '.']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/gateway:$SHORT_SHA']
  - name: 'gcr.io/google-cloud-sdk/slim'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - gateway
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/gateway:$SHORT_SHA
      - --region=${_REGION}
      - --allow-unauthenticated
      - --quiet

substitutions:
  _REGION: asia-south1
  _REPO: phool-gobhi

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/gateway:$SHORT_SHA'
